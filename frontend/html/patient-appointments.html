<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MediQueue — My Appointments</title>

  <link
    rel="icon"
    href="../assets/images/logo-icon.png"
    type="image/png"
  />

  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="patient-page">


  <!-- ================= MOBILE HEADER ================= -->

  <header class="patient-mobile-header">

    <div class="patient-mobile-brand">

      <img
        src="../assets/images/logo-icon.png"
        alt="MediQueue logo"
      />

      <div>
        <div class="patient-mobile-brand-name font-display">
          MediQueue
        </div>

        <div class="patient-mobile-brand-label">
          Patient Portal
        </div>
      </div>
    </div>


    <button
      class="patient-menu-button"
      id="patientMenuButton"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
    </button>

  </header>


  <!-- Dark background behind mobile menu -->
  <div
    class="patient-menu-overlay"
    id="patientMenuOverlay"
  ></div>

  <div class="app-shell">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar patient-sidebar" id="patientSidebar">
      <button
        class="patient-menu-close"
        id="patientMenuClose"
        type="button"
        aria-label="Close navigation menu"
      >
        ×
      </button>


      <div class="sidebar-brand">

        <img
          src="../assets/images/logo-icon.png"
          alt="MediQueue logo"
        />

        <div>
          <div class="sidebar-brand-name font-display">
            MediQueue
          </div>

          <div class="patient-sidebar-label">
            Patient Portal
          </div>
        </div>

      </div>


      <nav class="nav">

        <!-- Dashboard -->
        <a
          href="patient-dashboard.html"
          class="nav-item"
        >

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>

          Dashboard

        </a>


        <!-- Book Appointment -->
        <a
          href="book-appointment.html"
          class="nav-item"
        >

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="2"
            ></rect>

            <path d="M16 3v4"></path>
            <path d="M8 3v4"></path>
            <path d="M3 11h18"></path>
            <path d="M12 14v4"></path>
            <path d="M10 16h4"></path>
          </svg>

          Book Appointment

        </a>


        <!-- My Appointments (current page) -->
        <a
          href="patient-appointments.html"
          class="nav-item active"
          aria-current="page"
        >

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15 14"></polyline>
          </svg>

          My Appointments

        </a>


        <!-- Medical Record -->
        <a
          href="patient-medical-record.html"
          class="nav-item"
        >

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
            <path d="M9 13h6"></path>
            <path d="M9 17h6"></path>
          </svg>

          Medical Record

        </a>


        <!-- Notifications -->
        <a
          href="patient-notifications.html"
          class="nav-item"
        >

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
          </svg>

          Notifications

        </a>

      </nav>


      <!-- Logout -->
      <a
        href="patient-login.html"
        class="nav-logout"
        id="patientLogout"
      >

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>

        Logout

      </a>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

      <!-- TOP BAR -->

      <header class="topbar">

        <div class="patient-topbar-title">

          <span class="patient-topbar-arrow">
            ←
          </span>

          <span>
            My Appointments
          </span>

        </div>


        <div class="topbar-right">

          <div class="avatar">

            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
            </svg>

          </div>

          <div class="user-block">

            <div>
              <div
                class="user-name"
                id="patientTopbarName"
              >
              </div>

              <div class="user-role">
                Patient
              </div>
            </div>

          </div>

        </div>

      </header>


      <!-- PAGE CONTENT -->

      <div class="content patient-content">

        <div
          class="book-appointment-error"
          id="apptMessage"
          role="status"
          aria-live="polite"
          style="display:none"
        ></div>


        <section class="panel">

          <div class="panel-head">

            <div>

              <div class="panel-title">
                My Appointments
              </div>

              <div class="panel-subtitle">
                Reschedule or cancel a visit you booked
              </div>

            </div>


            <a
              href="book-appointment.html"
              class="patient-panel-link"
            >
              Book Appointment
            </a>

          </div>


          <!-- Search / filter / sort -->

          <div class="patient-appointment-toolbar">

            <div class="field">
              <label for="apptSearch">
                Search
              </label>
              <input
                class="input"
                type="search"
                id="apptSearch"
                placeholder="Reason or doctor…"
              />
            </div>


            <div class="field">
              <label for="apptStatusFilter">
                Status
              </label>
              <select class="input" id="apptStatusFilter">
                <option value="">All statuses</option>
              </select>
            </div>


            <div class="field">
              <label for="apptSort">
                Sort by
              </label>
              <select class="input" id="apptSort">
                <option value="date-desc">Newest first</option>
                <option value="date-asc">Oldest first</option>
                <option value="status">Status</option>
              </select>
            </div>

          </div>


          <!-- List rendered from the database -->

          <div class="patient-appointment-list" id="apptList">

            <div class="patient-appointment-empty">
              Loading your appointments…
            </div>

          </div>

        </section>

      </div>

    </main>

  </div>


  <!-- ================= RESCHEDULE MODAL ================= -->

  <div
    class="modal-overlay"
    id="rescheduleModal"
    style="display:none"
    onclick="if(event.target===this) closeModal('rescheduleModal')"
  >

    <div class="modal-box">

      <div class="modal-head">
        <h3 class="modal-title font-display">
          Reschedule appointment
        </h3>
        <button
          class="modal-close"
          type="button"
          onclick="closeModal('rescheduleModal')"
          aria-label="Close"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 6 6 18"></path>
            <path d="M6 6l12 12"></path>
          </svg>
        </button>
      </div>


      <form id="rescheduleForm" novalidate>

        <input type="hidden" id="rsId" />

        <div
          class="book-appointment-error"
          id="rsError"
          role="alert"
          style="display:none"
        ></div>


        <div class="field">
          <label for="rsDate">
            Date
          </label>
          <input
            class="input"
            type="date"
            id="rsDate"
            required
          />
        </div>


        <div class="field">
          <label for="rsTime">
            Time
          </label>
          <input
            class="input"
            type="time"
            id="rsTime"
            required
          />
        </div>


        <div class="field">
          <label for="rsReason">
            Reason for visit
          </label>
          <input
            class="input"
            type="text"
            id="rsReason"
            maxlength="160"
            placeholder="e.g. Follow-up on blood pressure"
          />
        </div>


        <div class="modal-actions">
          <button
            class="btn btn-secondary"
            type="button"
            onclick="closeModal('rescheduleModal')"
          >
            Close
          </button>

          <button
            class="btn btn-primary"
            type="submit"
            id="rsSaveBtn"
          >
            Save changes
          </button>
        </div>

      </form>

    </div>

  </div>


<script src="../js/data.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/render-helpers.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/pages/patient-appointments.js"></script>

</body>
</html>
