<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MediQueue — Add New Department</title>

  <link
    rel="icon"
    href="../assets/images/logo-icon.png"
    type="image/png"
  />

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body>

  <div class="app-shell">

    <!-- SIDEBAR -->
    <div class="sidebar">

      <div class="sidebar-brand">
        <img
          src="../assets/images/logo-icon.png"
          alt="MediQueue"
        />

        <div class="sidebar-brand-name font-display">
          MediQueue
        </div>
      </div>

      <div class="nav">

        <a class="nav-item" href="admin-dashboard.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" rx="1"/>
            <rect x="14" y="3" width="7" height="5" rx="1"/>
            <rect x="14" y="12" width="7" height="9" rx="1"/>
            <rect x="3" y="16" width="7" height="5" rx="1"/>
          </svg>
          Dashboard
        </a>

        <a class="nav-item" href="clinics.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="1"/>
            <path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01"/>
          </svg>
          Clinics
        </a>

        <a class="nav-item active" href="departments.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="1"/>
            <path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>
          </svg>
          Departments
        </a>

        <a class="nav-item" href="users.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="7" r="4"/>
            <path d="M2 21v-2a4 4 0 0 1 4-4h3"/>
            <circle cx="18" cy="17" r="3"/>
          </svg>
          Users
        </a>

        <a class="nav-item" href="reports.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18"/>
            <path d="M18 17V9M13 17V5M8 17v-4"/>
          </svg>
          Reports
        </a>

      </div>

      <a class="nav-logout" href="index.html" id="logoutLink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5M21 12H9"/>
        </svg>
        Logout
      </a>

    </div>

    <!-- MAIN -->
    <div class="main">

      <!-- TOPBAR -->
      <div class="topbar">

        <span class="role-badge">
          Administrator dashboard
        </span>

        <div class="topbar-right">

          <div class="bell-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <div class="bell-dot"></div>
          </div>

          <div class="user-block">

            <div class="avatar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21v-2a6 6 0 0 1 12 0v2"/>
              </svg>
            </div>

            <div>
              <div class="user-name">S. Ndaba</div>
              <div class="user-role">Administrator</div>
            </div>

          </div>

        </div>

      </div>

      <!-- CONTENT -->
      <div class="content">

        <div class="page-header">

          <div>

            <h1 class="page-title font-display">
              Add New Department
            </h1>

            <div class="page-sub">

              <a href="admin-dashboard.html" class="breadcrumb-link">
                Dashboard
              </a>

              <span> &gt; </span>

              <a href="departments.html" class="breadcrumb-link">
                Departments
              </a>

              <span> &gt; </span>

              <span>
                Add New Department
              </span>

            </div>

          </div>

        </div>

        <!-- FORM PANEL -->
        <div class="panel add-department-panel">

          <div class="add-department-heading">

            <div class="add-department-icon">
              <svg
                width="34"
                height="34"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="4" y="3" width="16" height="18" rx="1"/>
                <path d="M9 21v-4h6v4"/>
                <path d="M8 7h8"/>
                <path d="M12 5v4"/>
              </svg>
            </div>

            <h2 class="font-display">
              Create a New Department
            </h2>

            <p>
              Enter the department details below
            </p>

          </div>

          <form id="addDepartmentForm" class="add-department-form">

            <div class="department-form-row">

              <label for="departmentId">
                Department ID
              </label>

              <input
                class="input"
                type="text"
                id="departmentId"
                placeholder="e.g. DEP-001"
                required
              />

            </div>

            <div class="department-form-row">

              <label for="departmentName">
                Department Name
              </label>

              <input
                class="input"
                type="text"
                id="departmentName"
                placeholder="Enter department name"
                required
              />

            </div>

            <div class="department-form-row">

              <label for="departmentDescription">
                Description
              </label>

              <textarea
                class="input"
                id="departmentDescription"
                rows="4"
                placeholder="Enter department description"
              ></textarea>

            </div>

            <div class="add-department-actions">

              <a
                href="departments.html"
                class="btn btn-ghost"
              >
                Cancel
              </a>

              <button
                type="submit"
                class="btn btn-gold"
              >
                Add Department
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

  <script src="../js/data.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/render-helpers.js"></script>
  <script src="../js/pages/add-department.js"></script>

</body>
</html>
