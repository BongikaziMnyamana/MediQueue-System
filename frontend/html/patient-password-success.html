<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MediQueue — Password Changed</title>

  <link
    rel="icon"
    href="../assets/images/logo-icon.png"
    type="image/png"
  />

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body>

  <main class="patient-password-success-page">

    <div class="patient-password-success-content">

      <div class="patient-password-success-icon">
        <svg
          width="58"
          height="58"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m8 12 2.5 2.5L16 9"></path>
        </svg>
      </div>

      <h1 class="patient-password-success-title font-display">
        Password Changed!
      </h1>

      <p class="patient-password-success-message">
        Your password was changed successfully
      </p>

      <a
        href="patient-login.html"
        class="btn btn-primary patient-password-success-btn"
      >
        Login
      </a>

    </div>

  </main>

</body>
</html>
