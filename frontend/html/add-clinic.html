<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MediQueue — Add New Clinic</title>

  <link
    rel="icon"
    href="../assets/images/logo-icon.png"
    type="image/png"
  />

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body>

  <div class="app-shell">

    <!-- SIDEBAR -->
    <div class="sidebar">

      <div class="sidebar-brand">
        <img
          src="../assets/images/logo-icon.png"
          alt="MediQueue"
        />

        <div class="sidebar-brand-name font-display">
          MediQueue
        </div>
      </div>

      <div class="nav">

        <a class="nav-item" href="admin-dashboard.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" rx="1"/>
            <rect x="14" y="3" width="7" height="5" rx="1"/>
            <rect x="14" y="12" width="7" height="9" rx="1"/>
            <rect x="3" y="16" width="7" height="5" rx="1"/>
          </svg>
          Dashboard
        </a>

        <a class="nav-item active" href="clinics.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="1"/>
            <path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01"/>
          </svg>
          Clinics
        </a>

        <a class="nav-item" href="departments.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="1"/>
            <path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>
          </svg>
          Departments
        </a>

        <a class="nav-item" href="users.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="7" r="4"/>
            <path d="M2 21v-2a4 4 0 0 1 4-4h3"/>
            <circle cx="18" cy="17" r="3"/>
          </svg>
          Users
        </a>

        <a class="nav-item" href="reports.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18"/>
            <path d="M18 17V9M13 17V5M8 17v-4"/>
          </svg>
          Reports
        </a>

      </div>

      <a class="nav-logout" href="index.html" id="logoutLink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5M21 12H9"/>
        </svg>
        Logout
      </a>

    </div>

    <!-- MAIN -->
    <div class="main">

      <!-- TOPBAR -->
      <div class="topbar">

        <span class="role-badge">
          Administrator dashboard
        </span>

        <div class="topbar-right">

          <div class="bell-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <div class="bell-dot"></div>
          </div>

          <div class="user-block">

            <div class="avatar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21v-2a6 6 0 0 1 12 0v2"/>
              </svg>
            </div>

            <div>
              <div class="user-name">S. Ndaba</div>
              <div class="user-role">Administrator</div>
            </div>

          </div>

        </div>

      </div>

      <!-- CONTENT -->
      <div class="content">

        <!-- PAGE HEADER -->
        <div class="page-header">

          <div>

            <h1 class="page-title font-display">
              Add New Clinic
            </h1>

            <div class="page-sub">

              <a href="admin-dashboard.html" class="breadcrumb-link">
                Dashboard
              </a>

              <span> &gt; </span>

              <a href="clinics.html" class="breadcrumb-link">
                Clinics
              </a>

              <span> &gt; </span>

              <span>
                Add New Clinic
              </span>

            </div>

          </div>

        </div>

        <!-- ADD CLINIC FORM -->
        <div class="panel add-clinic-panel">

          <div class="add-clinic-heading">

            <div class="add-clinic-icon">
              <svg
                width="34"
                height="34"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M3 21h18"/>
                <path d="M5 21V7l7-4 7 4v14"/>
                <path d="M9 10h6"/>
                <path d="M12 7v6"/>
              </svg>
            </div>

            <h2 class="font-display">
              Create a New Clinic
            </h2>

            <p>
              Enter the details of the clinic
            </p>

          </div>

          <form id="addClinicPageForm" class="add-clinic-form">

            <div class="clinic-form-row">

              <label for="clinicName">
                Clinic Name
              </label>

              <input
                class="input"
                type="text"
                id="clinicName"
                placeholder="Enter clinic name"
                required
              />

            </div>

            <div class="clinic-form-row">

              <label for="clinicLocation">
                Location
              </label>

              <input
                class="input"
                type="text"
                id="clinicLocation"
                placeholder="Enter clinic location"
                required
              />

            </div>

            <div class="clinic-form-row">

              <label for="clinicContact">
                Contact Number
              </label>

              <input
                class="input"
                type="text"
                id="clinicContact"
                placeholder="Enter contact number"
                required
              />

            </div>

            <div class="add-clinic-actions">

              <a
                href="clinics.html"
                class="btn btn-ghost"
              >
                Cancel
              </a>

              <button
                type="submit"
                class="btn btn-gold"
              >
                Save Clinic
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

  <script src="../js/data.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/render-helpers.js"></script>
  <script src="../js/pages/add-clinic.js"></script>

</body>
</html>
