<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MediQueue — Password Changed</title>

  <link
    rel="icon"
    href="../assets/images/logo-icon.png"
    type="image/png"
  />

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body>

  <main class="staff-password-success-page">

    <section class="staff-password-success-card">

      <!-- MediQueue Brand -->
      <div class="staff-success-brand">

        <img
          src="../assets/images/logo-icon.png"
          alt="MediQueue"
        />

        <div>
          <h3>MediQueue</h3>
          <p>Staff Portal</p>
        </div>

      </div>


      <!-- Success Icon -->
      <div class="staff-success-icon">

        <svg
          width="58"
          height="58"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M8 12.5l2.5 2.5L16.5 9"></path>
        </svg>

      </div>


      <div class="staff-success-text">

        <span class="staff-success-label">
          PASSWORD RESET SUCCESSFUL
        </span>

        <h1 class="font-display">
          Password Changed!
        </h1>

        <p>
          Your staff password has been successfully reset.
          You can now sign in to your MediQueue staff account
          using your new password.
        </p>

      </div>


      <div class="staff-success-divider"></div>


      <div class="staff-success-security">

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            x="5"
            y="10"
            width="14"
            height="10"
            rx="2"
          ></rect>

          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>

        <span>
          Your account security has been updated.
        </span>

      </div>


      <a
        href="staff-login.html"
        class="btn btn-primary staff-success-button"
      >
        Back to Staff Login
        <span>→</span>
      </a>

    </section>

  </main>

</body>
</html>
