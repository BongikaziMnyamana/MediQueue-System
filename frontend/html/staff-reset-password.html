<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MediQueue — Staff Reset Password</title>

  <link
    rel="icon"
    href="../assets/images/logo-icon.png"
    type="image/png"
  />

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body>

  <div class="patient-reset-page">

    <!-- LEFT SIDE -->
    <section class="patient-reset-left">

      <a
        href="staff-login.html"
        class="patient-reset-back"
        aria-label="Back to staff login"
      >
        ←
      </a>

      <div class="patient-reset-content">

        <div class="patient-reset-heading">

          <h1 class="font-display">
            Reset your password
          </h1>

          <p>
            Create a new secure password for your staff account
          </p>

        </div>

        <div class="patient-reset-card">

          <form id="staffResetPasswordForm">

            <div class="field">

              <label for="staffEmail">
                Email Address
              </label>

              <input
                class="input"
                type="email"
                id="staffEmail"
                placeholder="Enter your staff email address"
                required
              />

            </div>


            <div class="field">

              <label for="newPassword">
                New Password
              </label>

              <div class="input-wrap">

                <input
                  class="input"
                  type="password"
                  id="newPassword"
                  placeholder="Enter new password"
                  required
                />

                <button
                  type="button"
                  class="input-icon-btn"
                  id="toggleNewPassword"
                  aria-label="Show password"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>

              </div>

            </div>


            <div class="field">

              <label for="confirmPassword">
                Confirm Password
              </label>

              <div class="input-wrap">

                <input
                  class="input"
                  type="password"
                  id="confirmPassword"
                  placeholder="Confirm new password"
                  required
                />

                <button
                  type="button"
                  class="input-icon-btn"
                  id="toggleConfirmPassword"
                  aria-label="Show password"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>

              </div>

            </div>


            <div
              id="staffResetMessage"
              class="patient-reset-error"
            ></div>


            <div class="patient-reset-actions">

              <a
                href="staff-login.html"
                class="btn btn-ghost patient-reset-cancel"
              >
                Cancel
              </a>

              <button
                type="submit"
                class="btn btn-primary patient-reset-submit"
              >
                Reset Password
              </button>

            </div>

          </form>

        </div>

      </div>

    </section>


    <!-- RIGHT SIDE -->
    <section class="patient-reset-right">

      <div class="patient-reset-security">

        <div class="patient-lock-icon">

          <svg
            width="58"
            height="58"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect
              x="5"
              y="10"
              width="14"
              height="10"
              rx="2"
            ></rect>

            <path
              d="M8 10V7a4 4 0 0 1 8 0v3"
            ></path>
          </svg>

        </div>


        <h2 class="font-display">
          Staff security and privacy
        </h2>

        <p>
          Reset your password to regain access to the MediQueue staff portal.
        </p>

      </div>

    </section>

  </div>


  <script src="../js/pages/staff-reset-password.js"></script>

</body>
</html>
